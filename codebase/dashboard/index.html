<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LabCoach Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-2: #1c212a;
    --border: #262c37;
    --text: #e6e9ef;
    --text-dim: #8b93a3;
    --accent: #f0b232;
    --accent-dim: #7a5c1a;
    --green: #4caf7d;
    --red: #e0616b;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: 4px; }
  nav button {
    background: none;
    border: 1px solid transparent;
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
  }
  nav button.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  main { display: flex; height: calc(100vh - 53px); }
  .view { display: none; flex: 1; overflow: hidden; }
  .view.active { display: flex; }

  /* Runs view */
  #runs-list {
    width: 300px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--panel);
  }
  .run-item {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .run-item:hover { background: var(--panel-2); }
  .run-item.selected { background: var(--panel-2); border-left: 3px solid var(--accent); }
  .run-item .cmd { font-weight: 600; }
  .run-item .meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .run-item .counts { font-size: 12px; margin-top: 4px; }
  #run-detail { flex: 1; overflow-y: auto; padding: 24px; }
  .empty-state { color: var(--text-dim); padding: 40px; text-align: center; }

  .stage {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    padding: 16px 20px;
  }
  .stage h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
  .stage-line { display: flex; justify-content: space-between; color: var(--text-dim); font-size: 13px; margin-bottom: 4px; }
  .candidate-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 8px;
  }
  .candidate-card .top-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim); }
  .badge.posted { color: var(--green); border-color: var(--green); }
  .badge.cleared { color: var(--red); border-color: var(--red); }
  .badge.source-cache { color: var(--accent); border-color: var(--accent-dim); }
  .content-text { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .rationale-text { color: var(--text); font-size: 12px; margin-top: 6px; font-style: italic; }
  .confidence { font-size: 12px; color: var(--text-dim); }

  /* Transcript view */
  #transcript-controls { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
  }
  #run-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #run-btn:disabled { opacity: 0.5; cursor: default; }
  #transcript-scroll { flex: 1; overflow-y: auto; padding: 20px; }
  .msg-row { display: flex; margin-bottom: 10px; }
  .msg-bubble {
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .msg-row.candidate .msg-bubble { border-left: 3px solid var(--accent); }
  .msg-row.bot .msg-bubble { border-style: dashed; opacity: 0.75; }
  .msg-meta { display: flex; gap: 8px; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .msg-content { white-space: pre-wrap; word-break: break-word; }
  .reply-hint { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; border-left: 2px solid var(--border); padding-left: 6px; }
  .decision-box {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .decision-box .rationale-full { display: none; margin-top: 6px; color: var(--text); font-style: italic; }
  .decision-box.expanded .rationale-full { display: block; }
  .trace-toggle {
    margin-top: 6px;
    font-size: 11px;
    color: var(--accent);
    cursor: pointer;
    display: inline-block;
  }
  .trace-content { display: none; margin-top: 6px; }
  .trace-content.shown { display: block; }
  .trace-entry { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-top: 6px; font-size: 11px; }
  .trace-meta { color: var(--text-dim); margin-bottom: 6px; }
  .trace-label { color: var(--text-dim); margin-top: 6px; }
  .trace-pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    margin: 4px 0 0;
    max-height: 240px;
    overflow-y: auto;
    color: var(--text);
  }
</style>
</head>
<body>
<header>
  <h1>LabCoach <span>Dashboard</span></h1>
  <nav>
    <button id="tab-runs" class="active">Runs &amp; Workflow</button>
    <button id="tab-transcript">Chat Transcript</button>
  </nav>
</header>

<main>
  <section id="view-runs" class="view active">
    <div id="runs-list"></div>
    <div id="run-detail"><div class="empty-state">Select a run on the left.</div></div>
  </section>

  <section id="view-transcript" class="view" style="flex-direction: column;">
    <div id="transcript-controls">
      <label for="dataset-select">Dataset:</label>
      <select id="dataset-select"></select>
      <button id="run-btn" onclick="runSelectedDataset()">&#9654; Run</button>
      <span id="transcript-count" style="color: var(--text-dim); font-size: 12px;"></span>
    </div>
    <div id="transcript-scroll"></div>
  </section>
</main>

<script>
const $ = (sel) => document.querySelector(sel);

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---- AI trace provenance ("did this really come from the graph?") ----
function traceToggleHtml(msgId) {
  return `
    <div class="trace-toggle" data-msg-id="${escapeHtml(msgId)}" onclick="toggleTrace(this)">&#128269; View raw AI trace</div>
    <div class="trace-content"></div>`;
}

async function toggleTrace(btn) {
  const container = btn.nextElementSibling;
  if (container.dataset.loaded) {
    container.classList.toggle("shown");
    return;
  }
  const msgId = btn.dataset.msgId;
  container.classList.add("shown");
  container.innerHTML = '<div class="trace-entry">Loading&hellip;</div>';
  const traces = await (await fetch(`/api/traces/${encodeURIComponent(msgId)}`)).json();
  container.dataset.loaded = "1";
  if (!traces.length) {
    container.innerHTML = '<div class="trace-entry">No LLM trace found for this message — this answer never called the model (rule-based-cap fallback, or no matching cache entry).</div>';
    return;
  }
  container.innerHTML = traces
    .map(
      (t) => `
      <div class="trace-entry">
        <div class="trace-meta">${escapeHtml(t.provider)} / ${escapeHtml(t.model_name)} &middot; ${Math.round(t.latency_ms)}ms &middot; ${fmtTime(t.timestamp)}${t.error ? ` &middot; <span style="color:var(--red)">error: ${escapeHtml(t.error)}</span>` : ""}</div>
        <div class="trace-label">Raw prompt sent to the model:</div>
        <pre class="trace-pre">${escapeHtml(t.raw_input_prompt)}</pre>
        <div class="trace-label">Raw model response:</div>
        <pre class="trace-pre">${escapeHtml(t.raw_llm_response)}</pre>
      </div>`
    )
    .join("");
}

// ---- Tabs ----
function showTab(name) {
  for (const t of ["runs", "transcript"]) {
    $(`#tab-${t}`).classList.toggle("active", t === name);
    $(`#view-${t}`).classList.toggle("active", t === name);
  }
}
$("#tab-runs").onclick = () => showTab("runs");
$("#tab-transcript").onclick = () => showTab("transcript");

// ---- Runs & Workflow ----
async function loadRuns() {
  const runs = await (await fetch("/api/runs")).json();
  const list = $("#runs-list");
  if (!runs.length) {
    list.innerHTML = '<div class="empty-state">No runs logged yet. Try /labcoach-check or /labcoach-demo in Discord.</div>';
    return;
  }
  list.innerHTML = runs
    .map(
      (r) => `
    <div class="run-item" data-run-id="${r.run_id}">
      <div class="cmd">/${escapeHtml(r.command)}</div>
      <div class="meta">${escapeHtml(r.source)} &middot; ${fmtTime(r.started_at)}</div>
      <div class="counts">${r.n_candidates} candidate(s) &rarr; ${r.n_posted} posted</div>
    </div>`
    )
    .join("");
  list.querySelectorAll(".run-item").forEach((el) => {
    el.onclick = () => selectRun(el.dataset.runId, el);
  });
  // auto-select the most recent run
  const first = list.querySelector(".run-item");
  if (first) selectRun(first.dataset.runId, first);
}

async function selectRun(runId, el) {
  document.querySelectorAll(".run-item").forEach((e) => e.classList.remove("selected"));
  if (el) el.classList.add("selected");
  const run = await (await fetch(`/api/runs/${runId}`)).json();
  renderRun(run);
}

function detectionBreakdownHtml(b) {
  const rows = [
    ["Total messages scanned", b.total_messages],
    ["Excluded: bot messages", b.bot_messages],
  ];
  return `
    <div style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);">
      ${rows.map(([label, n]) => `<div class="stage-line"><span>${escapeHtml(label)}</span><span>${n}</span></div>`).join("")}
      <div style="color: var(--text-dim); font-style: italic; font-size: 12px; margin-top: 4px;">Every non-bot message is now a candidate &mdash; the capped AI review step decides what actually needs attention.</div>
    </div>`;
}

function candidateCardHtml(c, aiByMsgId) {
  const ai = aiByMsgId[c.msg_id];
  const posted = ai && ai.still_needs_attention;
  const wasReviewed = ai && (ai.source === "live-ai" || ai.source === "cache");
  const badge = !ai
    ? ""
    : posted
    ? '<span class="badge posted">posted</span>'
    : wasReviewed
    ? '<span class="badge cleared">cleared by AI</span>'
    : '<span class="badge">not yet reviewed</span>';
  const sourceBadge = ai ? `<span class="badge source-${(ai.source || "").split("-")[0]}">${escapeHtml(ai.source)}</span>` : "";
  const confidence = ai && ai.confidence != null ? `<span class="confidence">${Math.round(ai.confidence * 100)}% confidence</span>` : "";
  const rationale = ai ? `<div class="rationale-text">${escapeHtml(ai.rationale)}</div>` : "";

  let expectedLine = "";
  if (ai && ai.expected) {
    const e = ai.expected;
    const match = !!e.needs_labcoach_review === !!(ai && ai.still_needs_attention);
    const matchBadge = match ? '<span class="badge posted">✅ match</span>' : '<span class="badge cleared">⚠️ mismatch</span>';
    expectedLine = `<div class="stage-line"><span>Expected: ${escapeHtml(e.response_status)}${e.needs_labcoach_review ? " (review)" : ""}</span>${matchBadge}</div>`;
  }

  return `
    <div class="candidate-card">
      <div class="top-line">
        <strong>${escapeHtml(c.msg_id)}</strong>
        <span>${badge} ${sourceBadge}</span>
      </div>
      <div class="content-text">${escapeHtml(c.content)}</div>
      <div class="stage-line"><span>waiting ${c.hours_since_posted.toFixed(1)}h in #${escapeHtml(c.channel)}</span>${confidence}</div>
      ${expectedLine}
      ${rationale}
      ${ai ? traceToggleHtml(c.msg_id) : ""}
    </div>`;
}

function renderRun(run) {
  const aiByMsgId = Object.fromEntries((run.ai_review || []).map((a) => [a.msg_id, a]));
  const detail = $("#run-detail");
  detail.innerHTML = `
    <div class="stage">
      <h3>1. Fetch</h3>
      <div class="stage-line"><span>Source</span><span>${escapeHtml(run.source)}</span></div>
      ${run.case_description ? `<div class="stage-line"><span>Case</span><span>${escapeHtml(run.case_description)}</span></div>` : ""}
      <div class="stage-line"><span>Messages loaded</span><span>${run.fetch.message_count}</span></div>
      <div class="stage-line"><span>Threshold used</span><span>${run.fetch.min_hours_unanswered}h unanswered</span></div>
      <div class="stage-line"><span>Reference "now"</span><span>${fmtTime(run.now)}</span></div>
    </div>

    <div class="stage">
      <h3>2. Rule-based detect</h3>
      <div class="stage-line"><span>Candidates found</span><span>${run.candidates.length}</span></div>
      ${run.detection_breakdown ? detectionBreakdownHtml(run.detection_breakdown) : ""}
    </div>

    <div class="stage">
      <h3>3. AI review &rarr; 4. Decisions</h3>
      ${run.candidates.length === 0 ? '<div class="stage-line">No candidates to review.</div>' : run.candidates.map((c) => candidateCardHtml(c, aiByMsgId)).join("")}
    </div>

    <div class="stage">
      <h3>5. Posted to Discord</h3>
      <div class="stage-line"><span>Embeds sent</span><span>${run.posted.length}</span></div>
    </div>
  `;
}

// ---- Chat transcript ----
async function loadDatasets() {
  const names = await (await fetch("/api/datasets")).json();
  const sel = $("#dataset-select");
  sel.innerHTML = names
    .map((n) => {
      let label = escapeHtml(n);
      if (n === "live") label = "\u{1F534} Live channel";
      else if (n.endsWith(".json")) label = "\u{1F4CB} " + label + " (golden set)";
      return `<option value="${escapeHtml(n)}">${label}</option>`;
    })
    .join("");
  sel.onchange = () => loadTranscript(sel.value);
  if (names.length) loadTranscript(names[0]);
}

async function runSelectedDataset() {
  const dataset = $("#dataset-select").value;
  const btn = $("#run-btn");
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = "Running…";
  try {
    const resp = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dataset }),
    });
    const record = await resp.json();
    if (!resp.ok) {
      alert("Run failed: " + (record.error || resp.statusText));
      return;
    }
    // reload the transcript (now has fresh decisions) and the run log
    await loadTranscript(dataset);
    await loadRuns();
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

async function loadTranscript(dataset) {
  const scroll = $("#transcript-scroll");
  scroll.innerHTML = '<div class="empty-state">Loading&hellip;</div>';
  $("#run-btn").style.display = dataset === "live" ? "none" : "inline-block";
  const data = await (await fetch(`/api/datasets/${encodeURIComponent(dataset)}/transcript`)).json();
  $("#transcript-count").textContent = `${data.messages.length} messages`;

  const byId = Object.fromEntries(data.messages.map((m) => [m.msg_id, m]));

  scroll.innerHTML = data.messages
    .map((m) => {
      const isCandidate = !!m.decision || !!m.expected;
      const rowClasses = ["msg-row"];
      if (isCandidate) rowClasses.push("candidate");
      if (m.is_bot) rowClasses.push("bot");

      const replyHint = m.reply_to && byId[m.reply_to] ? `<div class="reply-hint">&#8618; replying to: ${escapeHtml(byId[m.reply_to].content.slice(0, 80))}</div>` : "";

      let decisionBox = "";
      if (m.decision) {
        const d = m.decision;
        const wasReviewed = d.source === "live-ai" || d.source === "cache";
        const label = d.still_needs_attention ? "Actual: still needs attention" : wasReviewed ? "Actual: cleared by AI" : "Actual: not yet reviewed";
        const conf = d.confidence != null ? ` &middot; ${Math.round(d.confidence * 100)}% confidence` : "";
        decisionBox = `
          <div class="decision-box" onclick="this.classList.toggle('expanded')">
            ${label}${conf} &middot; click for rationale
            <div class="rationale-full">${escapeHtml(d.rationale)}</div>
          </div>`;
      }

      let expectedBox = "";
      if (m.expected) {
        const e = m.expected;
        let matchBadge = "";
        if (m.decision) {
          const match = !!e.needs_labcoach_review === !!m.decision.still_needs_attention;
          matchBadge = match ? ' <span class="badge posted">✅ match</span>' : ' <span class="badge cleared">⚠️ mismatch</span>';
        }
        expectedBox = `
          <div class="decision-box" onclick="this.classList.toggle('expanded')">
            Expected: ${escapeHtml(e.response_status)}${e.needs_labcoach_review ? " (needs LabCoach review)" : ""}${matchBadge} &middot; click for reason
            <div class="rationale-full">${escapeHtml(e.reason || "")}</div>
          </div>`;
      }

      return `
        <div class="${rowClasses.join(" ")}">
          <div class="msg-bubble">
            <div class="msg-meta"><span>#${escapeHtml(m.channel)}</span><span>${fmtTime(m.created_at)}</span>${m.is_bot ? "<span>bot</span>" : ""}</div>
            ${replyHint}
            <div class="msg-content">${escapeHtml(m.content) || "<em>(empty)</em>"}</div>
            ${expectedBox}
            ${decisionBox}
            ${m.expected || m.decision ? traceToggleHtml(m.msg_id) : ""}
          </div>
        </div>`;
    })
    .join("");
}

loadRuns();
loadDatasets();
</script>
</body>
</html>
